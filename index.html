<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Lunch Menu Roulette</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA 기본 -->
  <meta name="theme-color" content="#ffb400" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png" />

  <!-- KakaoTalk / SNS 미리보기용 OG 태그 -->
  <meta property="og:title" content="점심 메뉴 룰렛" />
  <meta property="og:description" content="5명이 투표하면 오늘의 점심 메뉴를 자동으로 골라주는 PWA" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="icons/og-lunch.png" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #222;
    }
    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 {
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.07);
      margin-bottom: 16px;
    }
    .person {
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
    }
    @media (min-width: 420px) {
      .person {
        grid-template-columns: 0.7fr 1.3fr;
        align-items: center;
      }
    }
    label {
      font-size: 0.85rem;
      font-weight: 600;
    }
    .name-input {
      width: 100%;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
      box-sizing: border-box;
      margin-bottom: 4px;
    }
    select {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 0.95rem;
      background: #fafafa;
      box-sizing: border-box;
    }
    .btn-primary {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      margin-top: 8px;
      cursor: pointer;
      background: #ffb400;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 8px;
      cursor: pointer;
      background: #e0e0e0;
    }
    .result {
      padding: 16px 8px 8px;
    }
    .result-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
      text-align: center;
    }
    .menu-type {
      font-size: 1.1rem;
      margin-bottom: 8px;
      text-align: center;
    }
    .restaurant {
      font-size: 0.95rem;
      color: #444;
      text-align: center;
    }
    .restaurant span {
      display: block;
    }
    .voters-title {
      margin-top: 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    #voterList {
      padding-left: 18px;
      margin-top: 4px;
      font-size: 0.9rem;
    }
    .note {
      font-size: 0.75rem;
      color: #999;
      margin-top: 8px;
      text-align: center;
    }
    /* 룰렛 오버레이 */
    #rouletteOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .roulette-box {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #ffe08a);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
      animation: spin 1.2s linear infinite;
    }
    .roulette-inner {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      box-sizing: border-box;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .roulette-pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 18px solid #ff6f00;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="rouletteOverlay">
    <div class="roulette-box">
      <div class="roulette-pointer"></div>
      <div class="roulette-inner">
        <div id="rouletteText">돌리는 중...</div>
      </div>
    </div>
  </div>

  <div class="app">
    <h1>점심 메뉴 룰렛</h1>
    <div class="subtitle">
      5명이 점심 메뉴를 선택하면<br />
      가장 많이 선택된 메뉴가 오늘의 점심으로 결정됩니다.
    </div>

    <div class="card">
      <div class="person">
        <div>
          <label for="name1">1번 이름</label>
          <input id="name1" class="name-input" type="text" placeholder="예: 홍길동 (선택사항)" />
        </div>
        <div>
          <select id="person1">
            <option value="">-- 메뉴 선택 --</option>
          </select>
        </div>
      </div>

      <div class="person">
        <div>
          <label for="name2">2번 이름</label>
          <input id="name2" class="name-input" type="text" placeholder="예: 김영희 (선택사항)" />
        </div>
        <div>
          <select id="person2">
            <option value="">-- 메뉴 선택 --</option>
          </select>
        </div>
      </div>

      <div class="person">
        <div>
          <label for="name3">3번 이름</label>
          <input id="name3" class="name-input" type="text" placeholder="예: 박철수 (선택사항)" />
        </div>
        <div>
          <select id="person3">
            <option value="">-- 메뉴 선택 --</option>
          </select>
        </div>
      </div>

      <div class="person">
        <div>
          <label for="name4">4번 이름</label>
          <input id="name4" class="name-input" type="text" placeholder="예: 이민수 (선택사항)" />
        </div>
        <div>
          <select id="person4">
            <option value="">-- 메뉴 선택 --</option>
          </select>
        </div>
      </div>

      <div class="person">
        <div>
          <label for="name5">5번 이름</label>
          <input id="name5" class="name-input" type="text" placeholder="예: 최지은 (선택사항)" />
        </div>
        <div>
          <select id="person5">
            <option value="">-- 메뉴 선택 --</option>
          </select>
        </div>
      </div>

      <button id="rouletteButton" class="btn-primary">룰렛 돌리기</button>
    </div>

    <div class="card" id="resultCard" style="display:none;">
      <div class="result">
        <div class="result-title">오늘의 점심 메뉴</div>
        <div class="menu-type" id="resultMenuType"></div>
        <div class="restaurant">
          <span id="restaurantName"></span>
          <span id="restaurantPhone"></span>
        </div>

        <div class="voters-title">참여자 목록</div>
        <ul id="voterList"></ul>

        <button id="shareButton" class="btn-secondary">결과를 카카오톡에 복사</button>
      </div>
      <div class="note">* 동률인 경우, 해당 메뉴 중에서 랜덤으로 선택됩니다.</div>
    </div>
  </div>

  <script>
    const menus = [
      { id: "pork_cutlet",        label: "돈까스 (포장)",           restaurant: "수복식당",       phone: "383-2427" },
      { id: "makguksu",           label: "막국수 (포장)",           restaurant: "골목식당",       phone: "382-9555" },
      { id: "pork_bone_stew",     label: "스파인스튜 (배달)",       restaurant: "뚝배기나라",     phone: "382-3133" },
      { id: "cockle_bibimbap",    label: "꼬막비빔밥 (포장)",       restaurant: "시골집",         phone: "383-7429" },
      { id: "bibimbap_delivery",  label: "비빔밥 (배달)",           restaurant: "뉴서울감자탕",   phone: "382-1789" },
      { id: "stone_pot_bibimbap", label: "돌솥비빔밥 (배달)",       restaurant: "뉴서울감자탕",   phone: "382-1789" },
      { id: "dongtaetang",        label: "동태탕 (배달)",           restaurant: "한마음식당",     phone: "383-0039" },
      { id: "steamed_seafood",    label: "해물찜 (배달)",           restaurant: "진성해물찜",     phone: "382-9993" },
      { id: "steamed_chicken",    label: "찜닭 (배달)",             restaurant: "원주통닭",       phone: "383-5252" },
      { id: "tray_jjajang",       label: "쟁반짜장 (배달)",         restaurant: "동원반점",       phone: "382-8889" },
      { id: "jjamppong",          label: "짬뽕 (배달)",             restaurant: "짬뽕상회",       phone: "383-8222" },
      { id: "tofu_sushi",         label: "유부초밥 (배달)",         restaurant: "얌얌유부도시락", phone: "383-1580" },
      { id: "kalguksu",           label: "칼국수 (포장)",           restaurant: "홍두참깨칼국수", phone: "382-1377" }
    ];

    const selectIds = ["person1", "person2", "person3", "person4", "person5"];
    const nameIds = ["name1", "name2", "name3", "name4", "name5"];

    let lastShareText = "";
    let isSpinning = false;

    function populateSelects() {
      selectIds.forEach(id => {
        const select = document.getElementById(id);
        menus.forEach(menu => {
          const opt = document.createElement("option");
          opt.value = menu.id;
          opt.textContent = menu.label;
          select.appendChild(opt);
        });
      });
    }

    function runRoulette() {
      if (isSpinning) return;

      const votes = {};
      const chosenDetails = [];

      selectIds.forEach((sid, index) => {
        const menuId = document.getElementById(sid).value;
        const name = document.getElementById(nameIds[index]).value.trim();
        if (menuId) {
          const menu = menus.find(m => m.id === menuId);
          chosenDetails.push({
            name: name || `참여자${index + 1}`,
            menu
          });
          votes[menuId] = (votes[menuId] || 0) + 1;
        }
      });

      if (chosenDetails.length === 0) {
        alert("최소 한 명 이상 메뉴를 선택해주세요.");
        return;
      }

      let maxCount = 0;
      let candidates = [];
      for (const [menuId, count] of Object.entries(votes)) {
        if (count > maxCount) {
          maxCount = count;
          candidates = [menuId];
        } else if (count === maxCount) {
          candidates.push(menuId);
        }
      }

      const winnerId = candidates[Math.floor(Math.random() * candidates.length)];
      const winnerMenu = menus.find(m => m.id === winnerId);

      startRouletteAnimation(winnerMenu, chosenDetails);
    }

    function startRouletteAnimation(winnerMenu, chosenDetails) {
      isSpinning = true;
      const overlay = document.getElementById("rouletteOverlay");
      const textEl = document.getElementById("rouletteText");
      overlay.style.display = "flex";

      let idx = 0;
      const labels = menus.map(m => m.label);
      const interval = setInterval(() => {
        textEl.textContent = labels[idx % labels.length];
        idx++;
      }, 100);

      setTimeout(() => {
        clearInterval(interval);
        overlay.style.display = "none";
        isSpinning = false;
        showResult(winnerMenu, chosenDetails);
      }, 1500);
    }

    function showResult(winnerMenu, chosenDetails) {
      document.getElementById("resultMenuType").textContent = winnerMenu.label;
      document.getElementById("restaurantName").textContent = winnerMenu.restaurant;
      document.getElementById("restaurantPhone").textContent = `(${winnerMenu.phone})`;

      const listEl = document.getElementById("voterList");
      listEl.innerHTML = "";
      chosenDetails.forEach(detail => {
        const li = document.createElement("li");
        li.textContent = `${detail.name}: ${detail.menu.label}`;
        listEl.appendChild(li);
      });

      const lines = [];
      lines.push(`오늘의 점심 메뉴: ${winnerMenu.label}`);
      lines.push(`식당: ${winnerMenu.restaurant} (${winnerMenu.phone})`);
      lines.push("");
      lines.push("참여자:");
      chosenDetails.forEach(detail => {
        lines.push(`- ${detail.name}: ${detail.menu.label}`);
      });
      lastShareText = lines.join("\n");

      document.getElementById("resultCard").style.display = "block";
    }

    async function handleShareCopy() {
      if (!lastShareText) {
        alert("먼저 룰렛을 돌려 결과를 만든 뒤에 공유해주세요.");
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(lastShareText);
          alert("결과가 클립보드에 복사되었습니다. 카카오톡 방에 붙여넣기 해주세요!");
          return;
        } catch (e) {
          console.log("Clipboard write failed:", e);
        }
      }
      const temp = document.createElement("textarea");
      temp.value = lastShareText;
      document.body.appendChild(temp);
      temp.select();
      try {
        document.execCommand("copy");
        alert("결과가 클립보드에 복사되었습니다. 카카오톡 방에 붙여넣기 해주세요!");
      } catch (e) {
        alert("자동 복사가 지원되지 않습니다. 아래 내용을 직접 복사해주세요.\n\n" + lastShareText);
      }
      document.body.removeChild(temp);
    }

    document.addEventListener("DOMContentLoaded", () => {
      populateSelects();
      document.getElementById("rouletteButton").addEventListener("click", runRoulette);
      document.getElementById("shareButton").addEventListener("click", handleShareCopy);

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(err => {
          console.log("Service worker registration failed:", err);
        });
      }
    });
  </script>
</body>
</html>
